<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema MEAL +PaZion</title>
    <link rel="stylesheet" href="css/main.css?v=23">
    <link rel="manifest" href="manifest.json?v=23">
    <meta name="theme-color" content="#7B35C4">
</head>

<body class="login-page">
    <div class="modal-overlay" style="background: var(--bg-dark);">
        <div class="modal modal-sm animate-fadein"
            style="background: var(--bg-card); box-shadow: var(--shadow-lg); border: 1px solid var(--border);">
            <div class="modal-body text-center" style="padding: var(--space-2xl);">
                <img src="assets/img/logo.png" alt="+PaZion"
                    style="height: 140px; margin: 0 auto var(--space-md); filter: none;"
                    onerror="this.src='https://placehold.co/200x80/0D0718/7B35C4?text=+PaZion'">

                <h2 style="margin-bottom: var(--space-xs); font-size: 28px; line-height: 1.1;">Sistema MEAL</h2>
                <p
                    style="font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: var(--space-xs);">
                    Monitoreo, Evaluación y Aprendizaje
                </p>
                <p class="text-muted" style="margin-bottom: var(--space-xl); font-size: 14px;">Inicia sesión para
                    acceder a tu área</p>

                <form id="loginForm">
                    <div class="form-group text-left">
                        <label class="form-label" for="email">Correo Institucional</label>
                        <input type="email" id="email" class="form-control" placeholder="ejemplo@pazion.org" required>
                    </div>
                    <div class="form-group text-left">
                        <label class="form-label" for="password">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div id="loginError" class="alert alert-danger hidden" style="margin-bottom: var(--space-md);">
                        Correo o contraseña incorrectos
                    </div>

                    <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: var(--space-md);">
                        Entrar al Sistema
                    </button>
                </form>

                <div class="divider-text" style="color: var(--text-muted); margin: var(--space-xl) 0;">Goles de Vida
                </div>

                <p class="text-sm text-muted">Asegúrese de estar conectado a internet durante el primer inicio de sesión
                    para sincronizar roles.</p>

                <p class="text-xs text-muted"
                    style="margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid var(--border);">
                    ¿Problemas para entrar?
                    <a href="#" id="btnRescue"
                        style="color: var(--purple-400); font-weight: 700; text-decoration: none;">Restablecer
                        Sistema</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { login, checkAuth } from './js/auth.js?v=23';
        import { initUI } from './js/app.js?v=23';

        // Inicializar actualizaciones y offline
        initUI();

        // Redirigir si ya está logueado
        checkAuth();

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw-v11.js?v=23')
                    .then(reg => console.log('SW registrado', reg))
                    .catch(err => console.log('SW error', err));
            });
        }

        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const result = await login(email, password);

            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                loginError.textContent = result.message || 'Correo o contraseña incorrectos';
                loginError.classList.remove('hidden');
            }
        });

        // Lógica de Rescate / Reset Nuclear
        document.getElementById('btnRescue')?.addEventListener('click', async (e) => {
            e.preventDefault();
            const msg = '¿Deseas aplicar una LIMPIEZA NUCLEAR?\n\nEsto borrará:\n1. Base de datos (incluyendo UnknownError)\n2. Sesiones activas\n3. Caché del navegador\n4. Service Workers\n\nUse esto solo si el sistema no le permite entrar tras varios intentos.';
            if (confirm(msg)) {
                // 1. Borrar Base de Datos
                const { resetDatabase } = await import('./js/db.js?v=23');
                await resetDatabase();
                
                // 2. Limpiar LocalStorage y Sessión
                localStorage.clear();
                sessionStorage.clear();

                // 3. Borrar Caches
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                }

                // 4. Desregistrar Service Workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(r => r.unregister()));
                }

                alert('Sistema purgado. El sistema se recargará ahora.');
                location.href = 'index.html?resetted=' + Date.now();
            }
        });
    </script>
</body>

</html>
